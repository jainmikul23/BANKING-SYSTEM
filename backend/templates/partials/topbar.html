<header class="app-topbar">
  <div class="topbar-title">{% block page_title %}Atheria Reserve{% endblock %}</div>
  <div class="topbar-actions">
    <!-- Haptic Vibration Feedback Toggle -->
    <button type="button" class="btn btn-glass btn-sm haptic-toggle-btn is-active" id="haptic-toggle-btn" title="Toggle Vibration & Haptics" aria-label="Toggle Vibration & Haptics">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="haptic-icon">
        <path d="M18 8a6 6 0 0 1 0 8"></path>
        <path d="M21 5a10 10 0 0 1 0 14"></path>
        <rect x="7" y="4" width="10" height="16" rx="2" ry="2"></rect>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
        <path d="M6 8a6 6 0 0 0 0 8"></path>
        <path d="M3 5a10 10 0 0 0 0 14"></path>
      </svg>
    </button>

    <!-- Theme Toggle -->
    <button class="btn btn-glass btn-sm theme-toggle-btn" id="theme-toggle-btn" title="Toggle Theme" aria-label="Toggle Theme">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    </button>

    {% if is_customer %}
      <a href="{% url 'banking:transfer' %}" class="btn btn-primary btn-sm">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="7" y1="17" x2="17" y2="7"></line>
          <polyline points="7 7 17 7 17 17"></polyline>
        </svg>
        <span>Send Money</span>
      </a>
    {% endif %}

    <a href="{% url 'accounts:logout' %}" class="btn btn-glass btn-sm" title="Sign Out">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </a>
  </div>
</header>
