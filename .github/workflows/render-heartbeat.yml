name: Render Backend Keep-Alive Heartbeat

on:
  schedule:
    # Trigger every 10 minutes (cron format: minute hour day month day-of-week)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  heartbeat:
    name: Ping Render Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Backend Keep-Alive Endpoints
        run: |
          echo "=========================================================="
          echo "Starting Keep-Alive Heartbeat for Render & Vercel..."
          echo "=========================================================="

          # Ping Render direct (with up to 60s timeout & 3 retries for cold starts)
          echo "Pinging Render backend direct: https://banking-system-1-0ae4.onrender.com/health/ ..."
          RENDER_STATUS=$(curl -s -S -o /dev/null -w "%{http_code}" --max-time 60 --retry 3 --retry-delay 5 "https://banking-system-1-0ae4.onrender.com/health/" || echo "TIMEOUT")
          echo "Render direct status code: $RENDER_STATUS"

          # Ping Vercel edge proxy (with up to 60s timeout & 3 retries)
          echo "Pinging Vercel edge proxy: https://atheria-reserve.vercel.app/health/ ..."
          VERCEL_STATUS=$(curl -s -S -o /dev/null -w "%{http_code}" --max-time 60 --retry 3 --retry-delay 5 "https://atheria-reserve.vercel.app/health/" || echo "TIMEOUT")
          echo "Vercel proxy status code: $VERCEL_STATUS"

          # Check results
          if [ "$RENDER_STATUS" = "200" ] || [ "$VERCEL_STATUS" = "200" ]; then
            echo "SUCCESS: Heartbeat verified. Backend is active, warm, and responsive."
            exit 0
          else
            echo "NOTICE: Server responded with status Render=$RENDER_STATUS, Vercel=$VERCEL_STATUS. Wake-up signal dispatched."
            exit 0
          fi
