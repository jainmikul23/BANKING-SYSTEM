{% extends "base.html" %}

{% block title %}Deposit Money | Aetheria Reserve Bank{% endblock %}
{% block page_title %}Deposit Funds{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
  <div class="glass-panel" style="padding: 36px; border-radius: var(--r-xl);">
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
      <div style="width: 44px; height: 44px; border-radius: var(--r-md); background: var(--ok-bg); border: 1px solid rgba(74,222,128,0.3); display: flex; align-items: center; justify-content: center; color: var(--ok);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </div>
      <div>
        <h2 style="font-size: 1.375rem; font-weight: 700;">Deposit to Account</h2>
        <p style="color: var(--muted); font-size: 0.813rem;">Add funds into your verified bank account</p>
      </div>
    </div>

    <form method="post" id="depositForm">
      {% csrf_token %}

      <div class="form-group">
        <label class="form-label" for="account_id">Select Destination Account</label>
        <select name="account_id" id="account_id" class="form-select" required>
          {% for acc in accounts %}
            <option value="{{ acc.id }}" {% if request.GET.account == acc.id|stringformat:"s" %}selected{% endif %}>
              {{ acc.account_number }} &bull; {{ acc.get_type_display }} (Current Bal: ₹{{ acc.balance|floatformat:2 }})
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="amount">Deposit Amount (INR)</label>
        <div style="position: relative;">
          <span style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 1.25rem; font-weight: 600; color: var(--muted);">₹</span>
          <input type="number" step="0.01" min="1" name="amount" id="amount" class="form-input" style="padding-left: 36px; font-size: 1.5rem; font-weight: 700; height: 56px;" placeholder="0.00" required>
        </div>

        <div class="quick-chips">
          <button type="button" class="chip" onclick="setAmount(500)">+ ₹500</button>
          <button type="button" class="chip" onclick="setAmount(1000)">+ ₹1,000</button>
          <button type="button" class="chip" onclick="setAmount(5000)">+ ₹5,000</button>
          <button type="button" class="chip" onclick="setAmount(10000)">+ ₹10,000</button>
          <button type="button" class="chip" onclick="setAmount(25000)">+ ₹25,000</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="description">Deposit Note (Optional)</label>
        <input type="text" name="description" id="description" class="form-input" placeholder="e.g. Salary, Consulting fee, Cash savings">
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 16px;">
        <span>Process Deposit</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
      </button>
    </form>
  </div>
</div>

<script>
function setAmount(val) {
  const input = document.getElementById('amount');
  const current = parseFloat(input.value) || 0;
  input.value = (current + val).toFixed(2);
}
</script>
{% endblock %}
